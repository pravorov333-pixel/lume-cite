<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="bg-glow bg-glow--1" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--2" aria-hidden="true"></div>

  <header class="nav glass">
    <a class="nav__brand" href="index.html">
      <img src="assets/logo.svg" alt="Lume" class="nav__logo">
      <span class="nav__name">LUME <em>VISUALS</em></span>
    </a>
    <nav class="nav__links">
      <a href="index.html#features" class="nav__link">Возможности</a>
      <a href="index.html#pricing" class="nav__link">Тарифы</a>
      <a href="catalog.html" class="nav__link">Каталог</a>
      <a href="account.html" class="nav__link">Друзья</a>
    </nav>
    <div class="nav__actions">
      <div id="nav-auth" class="nav-auth"></div>
      <button id="theme-toggle" class="icon-btn glass" title="Сменить тему" aria-label="Сменить тему">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="section auth-section">
      <div class="auth-card glass reveal">
        <h1 class="auth-card__title">Регистрация</h1>
        <p class="auth-card__subtitle">Создай аккаунт, чтобы добавлять друзей и продавать свои конфиги и партиклы.</p>

        <form id="register-form" class="auth-form">
          <label class="auth-field">
            <span>Никнейм</span>
            <input type="text" id="reg-username" placeholder="lume_player" required>
          </label>
          <label class="auth-field">
            <span>Email</span>
            <input type="email" id="reg-email" placeholder="you@example.com" required>
          </label>
          <label class="auth-field">
            <span>Пароль</span>
            <input type="password" id="reg-password" placeholder="Минимум 6 символов" required>
          </label>
          <button type="submit" class="btn btn--primary auth-form__submit">Зарегистрироваться</button>
        </form>

        <p id="auth-status" class="auth-status"></p>
        <p class="auth-card__switch">Уже есть аккаунт? <a href="login.html">Войти</a></p>
      </div>
    </section>
  </main>

  <footer class="footer glass">
    <div class="footer__inner">
      <a class="footer__brand" href="index.html">
        <img src="assets/logo.svg" alt="Lume" width="28" height="28">
        <span>LUME VISUALS</span>
      </a>
      <nav class="footer__links">
        <a href="index.html#features">Возможности</a>
        <a href="index.html#pricing">Тарифы</a>
        <a href="catalog.html">Каталог</a>
      </nav>
      <div class="footer__social">
        <a href="https://telegram.me/+iTX6597n68UyYTJi" target="_blank" rel="noopener" class="icon-btn glass" aria-label="Telegram">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
        </a>
        <a href="https://tiktok.com/@lume_client" target="_blank" rel="noopener" class="icon-btn glass" aria-label="TikTok">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
        </a>
      </div>
    </div>
    <p class="footer__copy">© 2026 Lume Visuals. Все права защищены.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
